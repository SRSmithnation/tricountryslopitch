<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri-County Slo-Pitch League</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<header class="tc-header">
  <div class="container" style="display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap">
    <img src="img/logo/TriCountySloPitchLogoTransparent.jpg" alt="Tri-County Slo-Pitch League">
    <nav><ul style="display:flex;gap:1.25rem;list-style:none;margin:0;padding:0">
      <li><a href="#" aria-current="page">Home</a></li>
      <li><a href="#standings">Standings</a></li>
      <li><a href="#schedule">Schedule</a></li>
      <li><a href="#teams">Teams</a></li>
    </ul></nav>
  </div>
</header>

<main class="container">
  <h1>Sunday Co-Ed <span class="tc-badge">2026 SEASON</span></h1>
  <p>Adult recreational slo-pitch in Kitchener, Ontario. 7 teams, Sunday mornings, May through July.</p>

  <h2 id="schedule">Next Games</h2>
  <table id="next-games"><thead><tr><th>#</th><th>Date</th><th>Time</th><th>Matchup</th><th>Venue</th></tr></thead><tbody></tbody></table>

  <h2 id="teams">Teams</h2>
  <table id="teams-table"><thead><tr><th>#</th><th>Team</th></tr></thead><tbody></tbody></table>

  <h2 id="standings">Standings</h2>
  <table id="standings-table"><thead><tr><th>Team</th><th>W</th><th>L</th><th>PCT</th></tr></thead><tbody></tbody></table>
</main>

<footer class="container"><small>Tri-County Slo-Pitch League &middot; Kitchener, ON</small></footer>

<script>
fetch('data/schedule-2026.json').then(r=>r.json()).then(g=>{
  const tb=document.querySelector('#next-games tbody');
  g.slice(0,6).forEach(x=>{
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${x.game}</td><td>${x.date}</td><td>${x.time}</td><td>${x.away} @ ${x.home}</td><td>${x.venue}</td></tr>`);
  });
});
fetch('teams/sunday-coed.json').then(r=>r.json()).then(t=>{
  const tb=document.querySelector('#teams-table tbody');
  Object.keys(t).sort((a,b)=>a-b).forEach(k=>
    tb.insertAdjacentHTML('beforeend',`<tr><td>${k}</td><td>${t[k]}</td></tr>`));
});
fetch('data/standings.csv').then(r=>r.text()).then(txt=>{
  const rows=txt.trim().split(/\r?\n/).slice(2);
  const tb=document.querySelector('#standings-table tbody');
  rows.forEach(line=>{
    const c=line.split(',');
    const w=+c[1]||0, l=+c[2]||0, pct=(w+l)?(w/(w+l)).toFixed(3):'.000';
    tb.insertAdjacentHTML('beforeend',`<tr><td>${c[0]}</td><td>${w}</td><td>${l}</td><td>${pct}</td></tr>`);
  });
});
</script>
</body>
</html>
