name: field conditions

on:
  schedule:
    # Sunday mornings in season only. Cron is UTC; Kitchener is UTC-4 in summer,
    # so 11:00-16:00 UTC is roughly 7am-noon local.
    - cron: '*/20 11-16 * 5,6,7,8 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: field-conditions
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch conditions
        run: python3 scripts/field-conditions.py

      - name: Open or update a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain src/data/field-conditions.json)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "field-conditions bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/field-conditions
          git add src/data/field-conditions.json
          git commit -m "Update field conditions"
          git push --force origin bot/field-conditions
          if [ -z "$(gh pr list --head bot/field-conditions --state open --json number -q '.[0].number')" ]; then
            gh pr create --head bot/field-conditions --base main \
              --title "Update field conditions" \
              --body "Diamond status from the City of Kitchener. Opened automatically; merges itself once checks pass."
          fi
          gh pr merge bot/field-conditions --squash --auto --delete-branch
