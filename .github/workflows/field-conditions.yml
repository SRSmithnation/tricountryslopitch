name: field conditions

on:
  schedule:
    # Sunday mornings in season only. Cron is UTC; Kitchener is UTC-4 in summer,
    # so 11:00-16:00 UTC is roughly 7am-noon local.
    - cron: '*/20 11-16 * 5,6,7,8 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-conditions
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch conditions
        run: python3 scripts/field-conditions.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain src/data/field-conditions.json)" ]; then
            git config user.name  "field-conditions bot"
            git config user.email "actions@github.com"
            git add src/data/field-conditions.json
            git commit -m "Update field conditions"
            git push
          else
            echo "nothing changed"
          fi
