<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-ca" http-equiv="Content-Language" />
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchener Co-ed Volleyball League</title>
    <script src="./components/current-standings.js" type="text/javascript"></script>
    <script src="./components/main-button.js" type="text/javascript"></script>
    <script src="./components/team-table.js" type="text/javascript"></script>
    <script src="./components/prior-standings-table.js" type="text/javascript"></script>
    <script src="./components/subpage-title.js" type="text/javascript"></script>
    <link rel="stylesheet" type="text/css" href="./css/division-pages.css" />
</head>

<body>
    <subpage-title data-title="D1 Division"></subpage-title>

    <div class="division-layout">
        <div class="division-left">
            <main-button
                href="./schedules/D1 Schedule Pt1 - 2026-2027.pdf"

        </div>
        <div class="division-right">
            <b>Coordinator:</b> <a href="mailto:%20jordankwvolleyball@gmail.com">Jordan Kay</a>, plays for Volleybulls

        <div class="division-full">
            <team-table data-source="./teams/d1.json"></team-table>
        </div>
        <div class="division-full">
            <current-standings

        </div>
        <div class="division-full">
            <prior-standings-table
                data-source="./prior_standings/d1-2025-2026.json"
                season-title="2025-2026 Standings">
            </prior-standings-table>
        </div>
        <div class="division-full">
            <prior-standings-table
                data-source="./prior_standings/d-2024-2025.json"
                season-title="2024-2025 D Standings">
            </prior-standings-table>
        </div>
    </div>

</body>

</html>
